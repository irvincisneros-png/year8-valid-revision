<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Year 8 VALID Science revision: all of Stage 4 in eight topics, with self-checking questions.">
<title>Year 8 VALID Revision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sticky topic bar over a single reading column; home is a grid of topic cards. */
:root {
  --bg: #f4f7f8; --surface: #ffffff; --ink: #14232b; --muted: #556a74; --line: #d6e0e4;
  --accent: #0b6e80; --accent-soft: #e0f0f3; --good: #17803d; --good-soft: #e3f4e8;
  --bad: #b4441a; --bad-soft: #fbe9e1; --gap: #9fb3bb;
  --font: "Lexend", "Segoe UI", system-ui, sans-serif;
  --step--1: 0.875rem; --step-0: 1rem; --step-1: 1.2rem; --step-2: 1.5rem; --step-3: 2rem;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a1f; --surface: #16242b; --ink: #e6eef1; --muted: #9db2bb; --line: #2a3d46;
  --accent: #5cc3d6; --accent-soft: #163a43; --good: #5fd08a; --good-soft: #15352276; --bad: #f08a62; --bad-soft: #3d221a; --gap: #4f6670; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1a1f; --surface: #16242b; --ink: #e6eef1; --muted: #9db2bb; --line: #2a3d46;
  --accent: #5cc3d6; --accent-soft: #163a43; --good: #5fd08a; --good-soft: #15352276; --bad: #f08a62; --bad-soft: #3d221a; --gap: #4f6670; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--step-0); line-height: 1.6; font-weight: 400; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-weight: 600; line-height: 1.25; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font-weight: 700; font-size: var(--step-0); white-space: nowrap; text-decoration: none; color: var(--ink); }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; text-decoration: none; color: var(--muted); font-size: var(--step--1); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); }
.nav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

main { padding-block: 24px 64px; }
.lead { color: var(--muted); max-width: 62ch; }

/* home */
.home-head { display: grid; gap: 8px; margin-bottom: 20px; }
.home-head h1 { font-size: var(--step-3); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card { display: grid; grid-template-rows: auto 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; color: var(--ink); }
.card img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; background: var(--accent-soft); }
.card .body { padding: 12px 14px 14px; display: grid; gap: 4px; align-content: start; }
.card .yr { font-size: var(--step--1); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.card h2 { font-size: var(--step-1); }
.card p { margin: 0; font-size: var(--step--1); color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--good); width: 0; }
.meter-label { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.howto { margin-top: 28px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.panel h2 { font-size: var(--step-1); margin-bottom: 8px; }
.verbs { display: grid; gap: 8px; margin: 0; }
.verbs dt { font-weight: 600; }
.verbs dd { margin: 0 0 4px; color: var(--muted); font-size: var(--step--1); }
.panel ul { margin: 0; padding-left: 1.2em; }

/* topic */
.topic-hero { display: grid; gap: 14px; margin-bottom: 8px; }
.topic-hero img { width: 100%; max-width: 100%; aspect-ratio: 3 / 2; max-height: 340px; object-fit: cover; border-radius: var(--radius); display: block; background: var(--accent-soft); }
.topic-hero .yr { font-size: var(--step--1); color: var(--accent); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.topic-hero h1 { font-size: var(--step-3); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 36px 0 6px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.section-title h2 { font-size: var(--step-2); }
.section-title .meter-label { font-size: var(--step--1); }
.hint { color: var(--muted); font-size: var(--step--1); margin: 0 0 8px; }

.q { padding: 18px 0; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.q-head { display: grid; grid-template-columns: 2.2em 1fr; gap: 4px; }
.q-num { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.q-text { min-width: 0; }
.q-body { display: grid; gap: 10px; margin-left: 2.2em; min-width: 0; }
.gap { display: inline-block; min-width: 5.5em; border-bottom: 2px solid var(--gap); margin: 0 2px; }
textarea { width: 100%; min-height: 3.2em; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.on-good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.on-bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.reveal { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; }
.reveal .lbl { font-size: var(--step--1); font-weight: 600; color: var(--accent); display: block; }
.selfmark { font-size: var(--step--1); color: var(--muted); }
.figure { margin: 0; display: grid; gap: 4px; justify-items: center; }
.figure img { max-width: 100%; border-radius: 6px; background: #fff; }
.figure figcaption { font-size: var(--step--1); color: var(--muted); }
.match { display: grid; gap: 8px; }
.match-row { display: grid; grid-template-columns: 1fr minmax(0, 1.4fr); gap: 10px; align-items: center; }
.match-row select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
.match-row.good select { border-color: var(--good); background: var(--good-soft); }
.match-row.bad select { border-color: var(--bad); background: var(--bad-soft); }

.stim { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 12px; margin-top: 10px; }
.stim p { margin: 0; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); font-variant-numeric: tabular-nums; }
caption { text-align: left; font-weight: 600; padding-bottom: 6px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--accent-soft); font-weight: 500; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 2em 1fr; gap: 8px; text-align: left; align-items: start; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.opt b { color: var(--accent); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.good { border-color: var(--good); background: var(--good-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.feedback { font-size: var(--step--1); padding: 8px 12px; border-radius: 8px; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback span { color: var(--ink); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.pager a { text-decoration: none; color: var(--accent); font-weight: 500; }
.ext { padding: 20px 0; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.ext h2 { font-size: var(--step-1); }
.ctx { border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; margin: 0; }
.starters { font-size: var(--step--1); color: var(--muted); }
.reset { margin-top: 28px; font-size: var(--step--1); color: var(--muted); }
.reset button { background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }
@media (max-width: 560px) {
  .match-row { grid-template-columns: 1fr; gap: 4px; }
  .q-body { margin-left: 0; }
  .topic-hero h1, .home-head h1 { font-size: var(--step-2); }
}
@media (prefers-reduced-motion: no-preference) { .reveal, .feedback { animation: fade .25s ease; } @keyframes fade { from { opacity: .3 } to { opacity: 1 } } }
</style>

<script>
const DATA = {"verbs": [{"word": "Identify", "meaning": "Recognise and name something.", "example": "Identify the independent variable. The wind speed."}, {"word": "Describe", "meaning": "Say what happens or what something is like, using data.", "example": "As temperature increases from 20 °C to 60 °C, dissolving time decreases."}, {"word": "Explain", "meaning": "Say how or why it happens, using 'because'.", "example": "Sugar dissolves faster in hot water because the particles move faster."}, {"word": "Compare", "meaning": "Give the similarities and the differences.", "example": "Both cells have a nucleus; only plant cells have a cell wall."}, {"word": "Predict", "meaning": "Say what will happen next, based on a pattern.", "example": "At 70 °C it will take about 30 s, as times keep falling."}, {"word": "Justify", "meaning": "Back up your answer with evidence or reasons.", "example": "Group 1 was most reliable because its range was smallest (0.2 °C)."}], "tips": ["Try the official VALID sample test on the NSW Department of Education website.", "Read the stimulus first: check the title, labels and units.", "Work out your answer, then cross out options you know are wrong.", "Never leave a question blank. Make your best choice and move on."], "topics": [{"num": 1, "title": "Observing the Universe", "year": 7, "blurb": "How scientists observe, measure and explain the Sun, Earth and Moon.", "key": [{"n": 1, "type": "short", "q": "JWST was built by NASA, ESA and Canada&#x27;s space agency. Why are big science projects usually team efforts?", "answer": "Any one: too big, costly and complex for one group; they need experts from many fields; scientists share data, check each other&#x27;s work and build on earlier discoveries."}, {"n": 2, "type": "tf_fix", "q": "A theory is a guess that becomes a law once it has been tested enough times.", "answer": "False. A theory is a well-tested explanation of WHY something happens. It never turns into a law; a law describes WHAT happens.", "truth": false}, {"n": 3, "type": "blank", "q": "The smallest change an instrument can show is called its <span class=\"gap\">&nbsp;</span>.", "answer": "resolution"}, {"n": 4, "type": "choose", "q": "&quot;The sand is wet, so the tide was high overnight&quot; is (an observation / an inference / a prediction).", "answer": "an inference"}, {"n": 5, "type": "choose", "q": "Recording the Moon&#x27;s shape each night for a month is a (systematic observation / controlled experiment).", "answer": "systematic observation (no variable is changed on purpose; it records natural changes over time)"}, {"n": 6, "type": "tf_fix", "q": "Galileo&#x27;s discovery of moons orbiting Jupiter was evidence against the idea that everything orbits Earth.", "answer": "True. Not everything orbits Earth, so it was evidence against the geocentric (Earth-centred) model.", "truth": true}, {"n": 7, "type": "short", "q": "Explain why it is summer in Australia in December.", "answer": "Earth&#x27;s axis is tilted (about 23.5°). In December the Southern Hemisphere tilts towards the Sun, so the Sun is higher, sunlight is more concentrated and days are longer. It is NOT because Earth is closer to the Sun."}, {"n": 8, "type": "short", "q": "Why do we see the Moon go through phases?", "answer": "The Moon reflects sunlight, so half of it is always lit. As it orbits Earth we see different amounts of that lit half."}, {"n": 9, "type": "short", "q": "Why can a lunar eclipse only happen at full Moon?", "answer": "A lunar eclipse needs Earth between the Sun and the Moon so Earth&#x27;s shadow falls on the Moon. The Moon is on the far side of Earth from the Sun only at full Moon."}, {"n": 10, "type": "match", "q": "Match each piece of Aboriginal or Torres Strait Islander sky knowledge with what it is used to predict.", "answer": "Moon phases: tides; Emu in the Sky: emus laying eggs; Spica: gathering rakai; strong twinkling: wind", "pairs": [["Phases of the Moon (for example, Yolŋu accounts)", "Height of the tides"], ["Emu in the Sky in the evening sky (for example, Kamilaroi and Euahlayi accounts)", "When emus lay eggs"], ["Spica setting just after sunset (for example, Yolŋu accounts)", "Time to gather rakai, a plant food"], ["Stars twinkling strongly (for example, Meriam people, Torres Strait)", "Windy weather coming"]]}], "valid": {"title": "Modelling the seasons with a lamp", "text": "Year 7 students at Woonona modelled the seasons. They shone a lamp onto black card from 30 cm away and tilted the card so the light hit it at different angles (90° means straight on). A digital thermometer (resolution 0.1 °C) measured the temperature rise after 10 minutes. Their notes say: &quot;30°, Trial 3: lamp knocked closer, about 20 cm.&quot;", "table": {"caption": "Table: Temperature rise of black card after 10 minutes (simulated data). *Mean of trials 1 and 2 only (trial 3 left out: lamp knocked closer).", "headers": ["Angle of light (°)", "Trial 1 (°C)", "Trial 2 (°C)", "Trial 3 (°C)", "Mean rise (°C)"], "rows": [["10", "1.5", "1.2", "1.4", "1.4"], ["30", "4.1", "3.9", "6.8", "4.0*"], ["50", "6.3", "6.0", "6.2", "6.2"], ["70", "7.6", "7.4", "7.7", "7.6"], ["90", "8.2", "7.9", "8.1", "8.1"]]}, "graph": "img/V1-G.png", "mcq": [{"n": 11, "q": "Which statement best describes the results?", "options": ["The temperature rise decreased as the angle increased.", "The temperature rise increased as the angle increased, but by less at larger angles.", "The temperature rise increased by the same amount for every 20° step.", "The angle had no clear effect on the temperature rise."], "answer": 1, "why": "The rise goes from 1.4 °C to 8.1 °C, but from 70° to 90° it only rises 0.5 °C, so the steps are not equal (C)."}, {"n": 12, "q": "Predict the mean temperature rise if the light hit the card at 60°.", "options": ["About 7.0 °C", "About 5.0 °C", "About 8.5 °C", "About 6.2 °C"], "answer": 0, "why": "60° lies between 50° (6.2 °C) and 70° (7.6 °C), so the rise should be between them; 8.5 °C is above even the 90° result."}, {"n": 13, "q": "Why did the students use a digital thermometer with 0.1 °C resolution instead of a glass one with 1 °C resolution?", "options": ["Digital thermometers are always more accurate than glass ones.", "A glass thermometer cannot measure temperatures above 10 °C.", "The digital thermometer has a bigger range.", "Excluding the faulty trial, repeat trials differ by only 0.1 °C to 0.3 °C, so whole degrees would hide these differences."], "answer": 3, "why": "Resolution must be smaller than the differences being measured; digital is not automatically more accurate (A), it needs calibrating."}, {"n": 14, "q": "At Woonona the midday Sun is about 79° above the horizon in December and about 32° in June. What do these results suggest?", "options": ["December is warmer because Earth is closer to the Sun then.", "June is warmer because low sunlight travels a shorter path.", "December is warmer because the high Sun&#x27;s light is concentrated on a smaller area.", "Both months should be equally warm because the Sun gives out the same energy."], "answer": 2, "why": "A steep angle (like 70° to 90° in the model, 7.6 to 8.1 °C) concentrates energy; the distance idea (A) is a common misconception."}]}, "hero": "img/hero1.jpg", "heroAlt": "Two students on a headland at night using a telescope and recording observations of the Moon."}, {"num": 2, "title": "Forces", "year": 7, "blurb": "Pushes, pulls, magnets and machines, and how to read force arrows.", "key": [{"n": 1, "type": "blank", "q": "Friction is a <span class=\"gap\">&nbsp;</span> force. Gravity, magnetism and electrostatic forces are <span class=\"gap\">&nbsp;</span> forces.", "answer": "contact; non-contact"}, {"n": 2, "type": "tf_fix", "q": "Balanced forces acting on the same moving car make it slow down and stop.", "answer": "False. Balanced forces do not change the motion: the car keeps moving at a steady speed in a straight line.", "truth": false}, {"n": 3, "type": "label", "q": "Figure 2.4: a trolley already moving right. A is the student&#x27;s push and B is friction. Give the size of A and B, then the net force.", "answer": "A = 30 N, B = 10 N. Net force = 30 − 10 = 20 N to the right, so the trolley speeds up (accelerates to the right).", "img": "img/T2-D4.png", "fig": "Figure 2.4", "letters": ["A", "B", "Net force"]}, {"n": 4, "type": "blank", "q": "When bike brakes rub on the wheel, friction changes <span class=\"gap\">&nbsp;</span> energy into <span class=\"gap\">&nbsp;</span> energy.", "answer": "kinetic (movement); thermal (heat), plus some sound"}, {"n": 5, "type": "tf_fix", "q": "Two balloons rubbed on the same wool jumper will push each other away.", "answer": "True. Both get the same (negative) charge, and like charges repel.", "truth": true}, {"n": 6, "type": "short", "q": "Why does the Moon orbit Earth instead of flying off in a straight line?", "answer": "The Moon moves sideways fast, and Earth&#x27;s gravity pulls it towards Earth, constantly changing its direction so it curves around Earth."}, {"n": 7, "type": "short", "q": "Use F = mg. a) Weight of a 12 kg dog on Earth (g = 9.8 N/kg)? b) Mass of a 3700 N rover on Mars (g = 3.7 N/kg)?", "answer": "a) F = 12 × 9.8 = 117.6 N. b) m = F ÷ g = 3700 ÷ 3.7 = 1000 kg."}, {"n": 8, "type": "choose", "q": "Like poles (attract / repel). Close field lines show a (strong / weak) field. Further away, the pull is (weaker / stronger).", "answer": "repel; strong; weaker"}, {"n": 9, "type": "short", "q": "On a crowbar, the effort is 4 times further from the fulcrum than the load. How does this help?", "answer": "The effort needed is only about a quarter of the load&#x27;s weight (mechanical advantage about 4), though the effort must move further."}, {"n": 10, "type": "match", "q": "Match each simple machine to an everyday use.", "answer": "Ramp: wheelchair; pulley: flag; wheel and axle: doorknob; woomera: spear.", "pairs": [["Ramp", "pushing a wheelchair up to a doorway"], ["Pulley", "raising a flag by pulling down on a rope"], ["Wheel and axle", "turning a doorknob"], ["Woomera (a lever used by many Aboriginal groups)", "throwing a spear faster and further"]]}], "valid": {"title": "Electromagnets at the scrap yard", "text": "A scrap metal yard near Port Kembla lifts steel with a giant electromagnet. Students modelled it by winding wire around a steel nail, keeping the current at 0.5 A. They changed the number of turns and counted the paperclips picked up, three trials each.", "table": {"caption": "Paperclips picked up by an electromagnet (simulated data)", "headers": ["Number of turns", "Trial 1 (paperclips)", "Trial 2 (paperclips)", "Trial 3 (paperclips)", "Mean (paperclips)"], "rows": [["10", "3", "4", "3", "3.3"], ["20", "7", "6", "8", "7.0"], ["30", "10", "11", "10", "10.3"], ["40", "14", "12", "13", "13.0"], ["50", "17", "18", "16", "17.0"]]}, "graph": "img/V2-G.png", "mcq": [{"n": 11, "q": "Which statement best describes the trend in the results?", "options": ["As the turns increase, the paperclips picked up increase steadily", "The paperclips increase at first, then level off", "As the turns increase, the paperclips picked up decrease", "There is no clear pattern"], "answer": 0, "why": "The means rise by about 3 to 4 paperclips for every extra 10 turns, with no levelling off up to 50 turns."}, {"n": 12, "q": "Predict the mean number of paperclips for 60 turns.", "options": ["About 17", "About 20", "About 27", "About 60"], "answer": 1, "why": "Following the pattern (about 3.4 more per 10 turns) gives about 20; 17 assumes no change, 60 assumes one paperclip per turn."}, {"n": 13, "q": "Which is a limitation of counting paperclips to measure strength?", "options": ["Paperclips are made of steel, so they are attracted", "The current was kept the same for every trial", "Paperclips give only whole numbers and can hang in chains, so small differences are missed", "Three trials were done for each number of turns"], "answer": 2, "why": "Counting is a coarse measure; options A, B and D describe sensible parts of the method, not limitations."}, {"n": 14, "q": "Which conclusion is best supported by these results?", "options": ["More turns make a stronger electromagnet when the current stays the same", "Current has the biggest effect on electromagnet strength", "The electromagnet would still work with the current switched off", "Doubling the turns always exactly doubles the paperclips"], "answer": 0, "why": "The means rise steadily with turns. Current was not changed, so nothing can be concluded about it, and the pattern is not an exact doubling."}]}, "hero": "img/hero2.jpg", "heroAlt": "A tug of war at a school carnival where neither team is moving: balanced forces."}, {"num": 3, "title": "Cells and Classification", "year": 7, "blurb": "What makes something alive, how we classify it, and the cells inside.", "key": [{"n": 1, "type": "short", "q": "Give two reasons a robot vacuum is not a living thing.", "answer": "Any two: it is not made of cells; it cannot grow; it cannot reproduce; it does not take in food or excrete wastes."}, {"n": 2, "type": "tf_fix", "q": "The koala&#x27;s scientific name is written correctly as Phascolarctos Cinereus.", "answer": "False. Genus has a capital, species is lower case: <em>Phascolarctos cinereus</em> (italics, or underlined when handwritten).", "truth": false}, {"n": 3, "type": "short", "q": "Give two ways many Aboriginal and Torres Strait Islander peoples group plants and animals.", "answer": "Any two: by their uses (food, medicine, tools, fibre); by their form (shape, appearance); by their function (behaviour, season, role on Country)."}, {"n": 4, "type": "blank", "q": "All living things are made of <span class=\"gap\">&nbsp;</span>, and all cells come from <span class=\"gap\">&nbsp;</span> cells.", "answer": "cells; existing (pre-existing)"}, {"n": 5, "type": "match", "q": "Match each cell part to its job.", "answer": "nucleus: contains DNA and controls the cell; cytoplasm: jelly-like fluid where many reactions happen; mitochondrion: releases energy by respiration; chloroplast: makes glucose by photosynthesis", "pairs": [["nucleus", "contains DNA and controls the cell"], ["cytoplasm", "jelly-like fluid where many reactions happen"], ["mitochondrion", "releases energy by respiration"], ["chloroplast", "makes glucose by photosynthesis"]]}, {"n": 6, "type": "short", "q": "Name two parts found in plant cells but not animal cells, and one part found in both.", "answer": "Plant only (any two): cell wall, chloroplasts, large permanent vacuole. Both (any one): nucleus, cell membrane, cytoplasm, mitochondria."}, {"n": 7, "type": "short", "q": "What does the cell membrane do?", "answer": "Controls what enters and leaves the cell."}, {"n": 8, "type": "choose", "q": "Bacteria cells (do / do not) have a nucleus. Yeast, a fungus, (does / does not) have chloroplasts.", "answer": "do not; does not"}, {"n": 9, "type": "short", "q": "A microscope has a 10× eyepiece and a 40× objective lens. What is the total magnification?", "answer": "400× (10 × 40)"}, {"n": 10, "type": "short", "q": "Root hair cells have a long, thin extension. How does this help them do their job?", "answer": "It gives a large surface area, so the cell can take in more water and minerals from the soil."}], "valid": {"title": "Bulli rock pool survey", "text": "Year 7 students surveyed a Bulli rock pool at low tide. They drew six organisms (P to U) and named them with the key. They counted zebra top snails in three 1 m² quadrats in shady cracks (14, 12 and 16 snails) and three on open, sunny rock (2, 0 and 1 snails). (simulated data)", "table": {"caption": "Dichotomous key: Illawarra rock pool organisms", "headers": ["Step", "If the organism...", "then..."], "rows": [["1a", "has jointed legs", "<strong>Red bait crab</strong> (<em>Plagusia chabrus</em>)"], ["1b", "does not have jointed legs", "go to 2"], ["2a", "has a soft body covered by a hard shell", "go to 3"], ["2b", "is not covered by a hard shell", "go to 4"], ["3a", "has a shell coiled into a spiral", "<strong>Zebra top snail</strong> (<em>Austrocochlea porcata</em>)"], ["3b", "has a shell that is a low cone, not coiled", "<strong>Variegated limpet</strong> (<em>Cellana tramoserica</em>)"], ["4a", "has a body with five arms", "<strong>Biscuit sea star</strong> (<em>Tosia australis</em>)"], ["4b", "does not have five arms", "go to 5"], ["5a", "is a soft column with a ring of tentacles on top", "<strong>Waratah anemone</strong> (<em>Actinia tenebrosa</em>)"], ["5b", "is made of chains of small, round, bead-like parts", "<strong>Neptune&#x27;s necklace</strong> (<em>Hormosira banksii</em>)"]]}, "diagram": "img/T3-D2.png", "mcq": [{"n": 11, "q": "Use the key. Which organism is U?", "options": ["Zebra top snail", "Biscuit sea star", "Variegated limpet", "Waratah anemone"], "answer": 2, "why": "U has no jointed legs (1b), a hard shell (2a) that is a low cone, not coiled (3b); the top snail&#x27;s shell is coiled."}, {"n": 12, "q": "Organisms P and U both reach step 3 of the key. Which structural feature do they share?", "options": ["A soft body covered by a hard shell", "Jointed legs", "Five arms", "A shell coiled into a spiral"], "answer": 0, "why": "Both went to step 3 through 2a; only P has a coiled shell, which is how step 3 separates them."}, {"n": 13, "q": "What is the mean number of snails per quadrat in the shady cracks?", "options": ["12", "13", "14", "42"], "answer": 2, "why": "(14 + 12 + 16) ÷ 3 = 42 ÷ 3 = 14; 42 is the total, not the mean."}, {"n": 14, "q": "Which conclusion is best supported by the snail counts?", "options": ["Zebra top snails cannot survive on open rock.", "More snails were found in shady cracks than on open rock, which may help stop them drying out.", "The snails in the cracks are a different species from those on open rock.", "Snails avoid open rock because it has more predators."], "answer": 1, "why": "Means of 14 versus 1 show more snails occurred in shady cracks; less drying out is a possible explanation. A overclaims because a few snails were on open rock, and the data say nothing about predators."}]}, "hero": "img/hero3.jpg", "heroAlt": "A rocky shore rock pool with an anemone, sea star, snails, limpets, seaweed and a crab."}, {"num": 4, "title": "Solutions and Mixtures", "year": 7, "blurb": "States of matter, dissolving, density and separating mixtures.", "key": [{"n": 1, "type": "blank", "q": "Lake water <span class=\"gap\">&nbsp;</span> into vapour, which rises, cools and <span class=\"gap\">&nbsp;</span> into clouds.", "answer": "evaporates; condenses"}, {"n": 2, "type": "short", "q": "Use particle movement to explain why a liquid can flow but a solid cannot.", "answer": "Liquid particles can slide past each other, so a liquid flows. Solid particles are held in fixed positions by strong attractive forces and can only vibrate, so a solid keeps its shape."}, {"n": 3, "type": "tf_fix", "q": "While ice is melting, its temperature keeps rising because heat is still going in.", "answer": "False. The temperature stays at 0 °C while the ice melts, because the energy is used to overcome the attractive forces between particles.", "truth": false}, {"n": 4, "type": "short", "q": "A 30.0 g rock raises water in a measuring cylinder from 50.0 mL to 62.0 mL. Find its density.", "answer": "Volume = 62.0 − 50.0 = 12.0 cm³; density = 30.0 ÷ 12.0 = 2.5 g/cm³."}, {"n": 5, "type": "match", "q": "Match each word to its meaning.", "answer": "Solute: the substance that dissolves; Solvent: the liquid that does the dissolving; Solution: the mixture made when a solute dissolves; Insoluble: does not dissolve", "pairs": [["Solute", "the substance that dissolves"], ["Solvent", "the liquid that does the dissolving"], ["Solution", "the mixture made when a solute dissolves"], ["Insoluble", "does not dissolve"]]}, {"n": 6, "type": "tf_fix", "q": "When sugar dissolves in tea, the total mass stays the same.", "answer": "True. The sugar particles spread out between the water particles; nothing is lost.", "truth": true}, {"n": 7, "type": "choose", "q": "Same water: cup A has 5 g sugar, cup B 20 g. A is more (dilute / concentrated). Sugar that won&#x27;t dissolve means (saturated / dilute).", "answer": "dilute; saturated"}, {"n": 8, "type": "choose", "q": "Water (H₂O) is a (compound / mixture). Salt water is a (compound / mixture).", "answer": "compound; mixture"}, {"n": 9, "type": "short", "q": "Name a method and the property it uses: a) sand from water b) salt from water, keeping the water.", "answer": "a) Filtration (particle size). b) Distillation (different boiling points: water boils off and is condensed, salt stays behind)."}, {"n": 10, "type": "blank", "q": "Yandying (Anmatyerre and Alyawarre Peoples, per CSIRO) shakes seeds in a dish to separate them by size and <span class=\"gap\">&nbsp;</span>.", "answer": "density (accept mass or weight)"}], "valid": {"title": "Growing crystals for a science fair", "text": "Students at Woonona High want to grow crystals. First they measured how much potassium nitrate and sodium chloride (table salt) dissolve in 100 g of water at different temperatures. Each result is the mean of three trials.", "table": {"caption": "Table 4.1: Mass of solute that dissolves in 100 g of water (simulated data)", "headers": ["Temperature (°C)", "Potassium nitrate (g)", "Sodium chloride (g)"], "rows": [["20", "32", "36"], ["30", "45", "36"], ["40", "64", "36"], ["50", "86", "37"], ["60", "110", "37"]]}, "graph": "img/V4-G.png", "mcq": [{"n": 11, "q": "Between which temperatures do the two solutes dissolve the same amount?", "options": ["Below 20 °C", "Between 40 °C and 50 °C", "Between 20 °C and 30 °C", "At 60 °C"], "answer": 2, "why": "At 20 °C sodium chloride is higher (36 g vs 32 g); at 30 °C potassium nitrate is higher (45 g vs 36 g), so the lines cross between 20 °C and 30 °C."}, {"n": 12, "q": "Which statement best describes the results?", "options": ["Both solutes dissolve about the same amount at every temperature.", "Sodium chloride is always more soluble than potassium nitrate.", "Temperature has no effect on how much dissolves.", "Potassium nitrate&#x27;s solubility rises steeply with temperature, but sodium chloride&#x27;s barely changes."], "answer": 3, "why": "Potassium nitrate goes from 32 g to 110 g, sodium chloride only from 36 g to 37 g. Salt is more soluble only at 20 °C."}, {"n": 13, "q": "Predict how much potassium nitrate would dissolve in 100 g of water at 70 °C.", "options": ["About 140 g", "About 115 g", "About 125 g", "About 200 g"], "answer": 0, "why": "Each 10 °C adds more than the last (13, 19, 22, 24 g), so the next rise is over 24 g: about 140 g. 115 g and 125 g assume the curve is levelling off."}, {"n": 14, "q": "A saturated potassium nitrate solution in 100 g of water at 60 °C is cooled to 20 °C. What happens?", "options": ["Nothing; all the solute stays dissolved.", "About 78 g of crystals form.", "About 32 g of crystals form.", "The water freezes."], "answer": 1, "why": "At 20 °C only 32 g can stay dissolved, so 110 − 32 = 78 g crystallises out. 32 g is the amount that stays dissolved, not the crystals."}]}, "hero": "img/hero4.jpg", "heroAlt": "A lab bench showing filtration, evaporation and a magnet separating mixtures."}, {"num": 5, "title": "Living Systems", "year": 8, "blurb": "Body systems, plant transport and how energy moves through food webs.", "key": [{"n": 1, "type": "blank", "q": "Smallest to largest: cell → <span class=\"gap\">&nbsp;</span> → <span class=\"gap\">&nbsp;</span> → organ system → organism.", "answer": "tissue, organ"}, {"n": 2, "type": "match", "q": "Match each set of major organs to its body system.", "answer": "Stomach and intestines: digestive; heart and blood vessels: circulatory; trachea and lungs: respiratory; kidneys and bladder: excretory.", "pairs": [["Stomach, small intestine, large intestine", "Digestive"], ["Heart, arteries, veins", "Circulatory"], ["Trachea, lungs, alveoli", "Respiratory"], ["Kidneys, ureters, bladder", "Excretory"]]}, {"n": 3, "type": "short", "q": "How do the respiratory and circulatory systems work together to get oxygen to muscle cells?", "answer": "Oxygen moves from the alveoli in the lungs into the blood in the capillaries; the heart pumps this blood through blood vessels to the muscle cells."}, {"n": 4, "type": "short", "q": "In an asthma attack the airways narrow. Why does the person feel tired?", "answer": "Less air reaches the alveoli, so less oxygen gets into the blood and to body cells, and the cells release less energy by respiration."}, {"n": 5, "type": "choose", "q": "(Xylem / Phloem) carries water up from the roots. (Xylem / Phloem) carries sugars around the plant.", "answer": "Xylem; Phloem"}, {"n": 6, "type": "tf_fix", "q": "Stomata are leaf pores that are opened and closed by guard cells.", "answer": "True. Guard cells open and close the stomata.", "truth": true}, {"n": 7, "type": "blank", "q": "Light and temperature are <span class=\"gap\">&nbsp;</span> factors. Plants and animals are <span class=\"gap\">&nbsp;</span> factors.", "answer": "abiotic; biotic"}, {"n": 8, "type": "short", "q": "Only black swans eat the seagrass in a lake. Predict what happens to the seagrass if swans leave.", "answer": "The seagrass would increase, because nothing else in the food web eats it."}, {"n": 9, "type": "short", "q": "Producers hold 20 000 kJ; primary consumers get 2 000 kJ. What percentage passed on? Where did the rest go?", "answer": "10%. Most of the rest was released by respiration and lost as heat, or was in parts not eaten and in wastes."}, {"n": 10, "type": "tf_fix", "q": "Decomposers recycle energy back to the producers.", "answer": "False. Decomposers recycle matter (nutrients). Energy flows one way and is lost as heat, so it is not recycled.", "truth": false}], "valid": {"title": "Rabbits, foxes and calicivirus", "text": "Rangers at a western NSW reserve counted rabbits and foxes each winter along three 10 km spotlight routes at night, and counted native shrub seedlings in fixed plots. Rabbit calicivirus, a virus that kills many rabbits, reached the reserve in spring 1996, between the 1996 and 1997 counts.", "table": {"caption": "Table: Rabbits, foxes and shrub seedlings, 1994 to 2000 (simulated data)", "headers": ["Year", "Rabbits, route 1 (per 10 km)", "Rabbits, route 2 (per 10 km)", "Rabbits, route 3 (per 10 km)", "Mean rabbits (per 10 km)", "Mean foxes (per 10 km)", "Shrub seedlings (per 100 m²)"], "rows": [["1994", "431", "398", "446", "425.0", "3.5", "3"], ["1995", "388", "412", "379", "393.0", "3.3", "5"], ["1996", "415", "402", "431", "416.0", "3.6", "4"], ["1997", "102", "88", "97", "95.7", "3.1", "9"], ["1998", "64", "79", "70", "71.0", "2.0", "17"], ["1999", "98", "312", "107", "172.3", "1.6", "21"], ["2000", "131", "142", "128", "133.7", "1.7", "22"]]}, "graph": "img/V5-G.png", "mcq": [{"n": 11, "q": "Which statement best describes mean rabbit numbers from 1994 to 2000?", "options": ["They fell steadily every year.", "They stayed high until 1996, dropped sharply in 1997, then partly recovered.", "They rose steadily after the virus arrived.", "They did not change much over the seven years."], "answer": 1, "why": "About 390 to 425 until 1996, then 95.7 and 71.0, then 133.7 by 2000. (The 1999 mean is pushed up by a suspected outlier on route 2; rangers should check that night&#x27;s survey conditions before leaving it out.)"}, {"n": 12, "q": "By about what percentage did the mean rabbit count fall from 1996 to 1997?", "options": ["About 25%", "About 50%", "About 77%", "About 95%"], "answer": 2, "why": "(416.0 − 95.7) ÷ 416.0 × 100 = 77%. 95% would mean only about 21 rabbits per 10 km were left."}, {"n": 13, "q": "Which is the best explanation for mean fox numbers falling from 1997 to 1999?", "options": ["Foxes caught calicivirus from the rabbits.", "Fewer rabbits meant less food, so fewer foxes survived and raised young.", "The extra shrub seedlings crowded the foxes out.", "Fox numbers always drop in winter, when the counts were made."], "answer": 1, "why": "Rabbits are prey for foxes. Calicivirus affects rabbits, not foxes, and every count was made in winter, so season cannot explain the change."}, {"n": 14, "q": "A student claims the virus caused the rise in seedlings. Which extra data would best test this claim?", "options": ["Seedling counts from 2000 only, using more plots", "A photo of a rabbit eating a seedling", "Fox counts from more routes in 1999", "Seedling counts over the same years from a similar reserve the virus did not reach"], "answer": 3, "why": "A comparison site helps separate the effect of fewer rabbits from shared changes such as rainfall."}]}, "hero": "img/hero5.jpg", "heroAlt": "A cutaway of Lake Illawarra: seagrass, prawns, a flathead and a pelican in a food chain."}, {"num": 6, "title": "Periodic Table and Atomic Structure", "year": 8, "blurb": "Atoms, elements and the patterns in the periodic table.", "key": [{"n": 1, "type": "blank", "q": "An <span class=\"gap\">&nbsp;</span> is the smallest particle of an element that still has the properties of that element.", "answer": "atom"}, {"n": 2, "type": "match", "q": "Match each material to a use.", "answer": "Copper: electrical wires; Aluminium: drink cans; Steel: bridges; Helium: party balloons", "pairs": [["Copper", "electrical wires"], ["Aluminium", "drink cans"], ["Steel", "bridges"], ["Helium", "party balloons"]]}, {"n": 3, "type": "short", "q": "Steel is an alloy of iron and a little carbon. Why are bridges made of steel, not pure iron?", "answer": "Steel is stronger and harder than pure iron, so it can hold heavy loads."}, {"n": 4, "type": "choose", "q": "Silicon is shiny but brittle and conducts only a little, so it is a (metal / non-metal / metalloid).", "answer": "metalloid"}, {"n": 5, "type": "short", "q": "Name two lab tests that would tell a metal from a non-metal.", "answer": "Any two: conductivity (circuit with a globe or ammeter: metals conduct); lustre (rub with sandpaper: metals shine); malleability (tap with a hammer, wearing safety glasses: metals bend, non-metals shatter)."}, {"n": 6, "type": "blank", "q": "Protons (charge +1) and <span class=\"gap\">&nbsp;</span> (no charge) are in the nucleus. <span class=\"gap\">&nbsp;</span> (charge −1) move in shells around it.", "answer": "neutrons; electrons"}, {"n": 7, "type": "short", "q": "Tiny positive &#x27;alpha particles&#x27; fired at gold foil sometimes bounced back. What did this show about atoms?", "answer": "Atoms have a tiny, dense, positive nucleus that repels the alpha particles. Thomson&#x27;s &#x27;plum pudding&#x27; model could not explain this, so the model of the atom was changed."}, {"n": 8, "type": "short", "q": "Magnesium has atomic number 12. Write its electron arrangement and name its period.", "answer": "2,8,2; Period 3"}, {"n": 9, "type": "tf_fix", "q": "Potassium is below sodium in Group 1, so potassium is more reactive than sodium.", "answer": "True. Group 1 metals get more reactive down the group.", "truth": true}, {"n": 10, "type": "tf_fix", "q": "One molecule of CO₂ (C = carbon, O = oxygen) contains one carbon atom and one oxygen atom.", "answer": "False. CO₂ contains one carbon atom and two oxygen atoms.", "truth": false}], "valid": {"title": "Which roof lasts by the sea?", "text": "Year 8 students at a coastal Illawarra school wanted to know which roofing metal lasts best in salty sea air. They hung equal-sized strips of five metals in salt water for four weeks, then measured the mass each strip lost to corrosion. They did three trials for each metal. The approximate cost of each metal is also shown.", "table": {"caption": "Table 6.1: Mass lost by metal strips after four weeks in salt water (simulated data)", "headers": ["Metal strip", "Trial 1 (mg)", "Trial 2 (mg)", "Trial 3 (mg)", "Mean mass lost (mg)", "Cost per kg (plain steel = 1)"], "rows": [["Plain steel", "48", "52", "50", "50", "1"], ["Galvanised steel (zinc coated)", "12", "26", "13", "17", "1.2"], ["Aluminium", "6", "5", "7", "6", "3"], ["Copper", "4", "3", "5", "4", "10"], ["Stainless steel", "1", "2", "1", "1.3", "4"]]}, "graph": "img/V6-G.png", "mcq": [{"n": 11, "q": "Which conclusion is best supported by the data?", "options": ["Copper corroded the least of all five metals.", "Coating steel with zinc greatly reduced corrosion compared with plain steel.", "The more expensive the metal, the more it corroded.", "Aluminium corroded more than plain steel."], "answer": 1, "why": "Galvanised steel lost a mean of 17 mg compared with 50 mg for plain steel. Stainless steel, not copper, lost the least."}, {"n": 12, "q": "Which is the biggest limitation of using this test to predict how long a real roof will last?", "options": ["Real roofs sit in salty air for many years, not under salt water for four weeks.", "Three trials for each metal is too many.", "All the strips were the same size.", "Mass lost cannot be measured in milligrams."], "answer": 0, "why": "The test conditions differ from real roofs (air, not immersion; years, not weeks), so results may not match. Same-sized strips and repeat trials make it fairer, not weaker."}, {"n": 13, "q": "A builder can spend no more than 1.5 times the cost of plain steel. Comparing equal masses of metal, which metal should they choose for a roof near the beach?", "options": ["Plain steel", "Stainless steel", "Galvanised steel", "Copper"], "answer": 2, "why": "Only plain and galvanised steel fit the budget, and galvanised steel corrodes far less. Stainless steel corrodes least but costs 4 times as much."}, {"n": 14, "q": "Copper corroded very little, but most copper is used for electrical wiring, not roofs. Which properties best explain its use in wiring?", "options": ["It is cheap and plentiful", "It conducts electricity very well and can be drawn into wire", "It is brittle and shiny", "It has a low density"], "answer": 1, "why": "Copper is an excellent conductor and ductile. It is not cheap (10 times the cost of steel here), which is one reason roofs are rarely copper."}]}, "hero": "img/hero6.jpg", "heroAlt": "Everyday objects made of elements: copper wire, aluminium can, steel roofing, gold ring, pencil and balloon."}, {"num": 7, "title": "Change", "year": 8, "blurb": "Energy changes, chemical reactions and how rocks change over time.", "key": [{"n": 1, "type": "blank", "q": "A stretched rubber band stores <span class=\"gap\">&nbsp;</span> potential energy. A moving car has <span class=\"gap\">&nbsp;</span> energy.", "answer": "elastic; kinetic"}, {"n": 2, "type": "match", "q": "Match each energy transfer to an example.", "answer": "Conduction: metal spoon in soup; convection: warm air rising from a heater; radiation: the Sun warming your face", "pairs": [["Conduction", "A metal spoon gets hot in soup"], ["Convection", "Warm air rises from a heater"], ["Radiation", "The Sun warms your face"]]}, {"n": 3, "type": "short", "q": "A solar panel turns 100 J of light into 20 J of electricity. All the rest becomes thermal energy. How much? Why?", "answer": "80 J, because energy cannot be created or destroyed: 100 J in = 20 J electrical + 80 J thermal out."}, {"n": 4, "type": "tf_fix", "q": "Ice melting is a chemical change because it looks different.", "answer": "False. Melting is a physical change: no new substance forms (it is still water).", "truth": false}, {"n": 5, "type": "blank", "q": "Magnesium burns in oxygen to make magnesium oxide. Word equation: <span class=\"gap\">&nbsp;</span> + <span class=\"gap\">&nbsp;</span> → <span class=\"gap\">&nbsp;</span>", "answer": "magnesium + oxygen → magnesium oxide"}, {"n": 6, "type": "blank", "q": "Photosynthesis: carbon dioxide + water → <span class=\"gap\">&nbsp;</span> + oxygen. Respiration: glucose + oxygen → carbon dioxide + <span class=\"gap\">&nbsp;</span>.", "answer": "glucose; water"}, {"n": 7, "type": "short", "q": "Glossopteris plant fossils are found on five southern continents. How does this support plate tectonics?", "answer": "The plant could not cross oceans, so these continents were once joined. Moving plates have since carried them apart."}, {"n": 8, "type": "short", "q": "Gunditjmara accounts may record Budj Bim erupting about 37,000 years ago. What does this show about Earth&#x27;s surface?", "answer": "Earth&#x27;s surface changes: the volcano&#x27;s lava reshaped the land, and Aboriginal Cultural accounts can be evidence of eruptions people saw."}, {"n": 9, "type": "blank", "q": "Name the rock type. Forms when magma cools: <span class=\"gap\">&nbsp;</span>. Forms when layers of sediment are pressed together: <span class=\"gap\">&nbsp;</span>. Forms when heat and pressure change a rock: <span class=\"gap\">&nbsp;</span>.", "answer": "igneous; sedimentary; metamorphic"}, {"n": 10, "type": "tf_fix", "q": "In undisturbed rock layers, fossils in the bottom layer are the oldest.", "answer": "True. Lower layers formed first (law of superposition), so fossils show which living things existed at different times.", "truth": true}], "valid": {"title": "Hot or cold? Four reactions", "text": "A Year 8 class tested four chemical reactions. For each one they put 25 mL of solution in a polystyrene cup with a lid, added the second chemical, and recorded the biggest temperature change. A positive change means the temperature went up. Each reaction was done three times.", "table": {"caption": "Table: Temperature change in four reactions (simulated data)", "headers": ["Reaction", "Trial 1 (°C)", "Trial 2 (°C)", "Trial 3 (°C)", "Mean change (°C)"], "rows": [["1: magnesium + acid", "8.5", "9.0", "8.7", "8.7"], ["2: sodium hydroxide + acid", "6.2", "6.4", "2.1", "4.9"], ["3: citric acid + bicarb soda", "-5.0", "-4.6", "-5.2", "-4.9"], ["4: vinegar + bicarb soda", "-2.8", "-3.1", "-2.9", "-2.9"]]}, "graph": "img/V7-G.png", "mcq": [{"n": 11, "q": "Which reactions are endothermic?", "options": ["3 and 4", "1 and 2", "1 only", "2 and 4"], "answer": 0, "why": "Reactions 3 an const app = document.getElementById("app");
const nav = document.getElementById("nav");
const KEY = "valid-rev-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const el = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (html) e.innerHTML = html; return e; };

function topicScore(t) {
  const s = store["t" + t.num] || {};
  const done = Object.values(s.k || {}).filter(Boolean).length + Object.values(s.m || {}).filter(v => v === true).length;
  return { done, total: t.key.length + t.valid.mcq.length };
}

function buildNav(current) {
  nav.innerHTML = "";
  const links = [["home", "Start"], ...DATA.topics.map(t => ["topic" + t.num, "Topic " + t.num]), ["long", "Long answers"]];
  for (const [id, label] of links) {
    const a = el("a", { href: "#" + id }, label);
    if (id === current) a.setAttribute("aria-current", "page");
    nav.appendChild(a);
  }
  const cur = nav.querySelector('[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: "nearest", inline: "center" });
}

function meter(t) {
  const { done, total } = topicScore(t);
  return `<div class="meter" aria-hidden="true"><i style="width:${Math.round(100 * done / total)}%"></i></div><span class="meter-label">${done} of ${total} done</span>`;
}

function renderHome() {
  app.innerHTML = `<div class="home-head"><h1>Year 8 VALID Science revision</h1>
    <p class="lead">All of Stage 4 in eight topics. Each topic has ten key-idea questions to answer from memory, then four VALID-style questions that use a table, graph or diagram. Your progress is saved on this device.</p></div>
    <div class="cards" id="cards"></div>
    <div class="howto">
      <section class="panel"><h2>Question words in VALID</h2><dl class="verbs">${DATA.verbs.map(v => `<div><dt>${v.word}</dt><dd>${v.meaning} <em>${v.example}</em></dd></div>`).join("")}</dl></section>
      <section class="panel"><h2>Tips for the test</h2><ul>${DATA.tips.map(t => `<li>${t}</li>`).join("")}</ul>
      <h2 style="margin-top:14px">How to use this</h2><ul><li>Type your answer first, then check it.</li><li>Be honest when you mark yourself. Come back to the ones you missed.</li><li>Finish with the <a href="#long">long answer practice</a>.</li></ul></section>
    </div>
    <p class="reset">Want to start again? <button type="button" id="reset">Clear my progress</button></p>`;
  const cards = document.getElementById("cards");
  for (const t of DATA.topics) {
    const a = el("a", { class: "card", href: "#topic" + t.num });
    a.innerHTML = `${t.hero ? `<img src="${t.hero}" alt="" loading="lazy">` : ""}<div class="body"><span class="yr">Topic ${t.num} · Year ${t.year}</span><h2>${t.title}</h2><p>${t.blurb}</p>${meter(t)}</div>`;
    cards.appendChild(a);
  }
  let armed = false;
  document.getElementById("reset").addEventListener("click", e => {
    if (!armed) { armed = true; e.target.textContent = "Tap again to clear everything"; return; }
    store = {}; save(); renderHome();
  });
}

function keyState(t) { const k = "t" + t.num; store[k] = store[k] || { k: {}, m: {}, a: {} }; store[k].a = store[k].a || {}; return store[k]; }
function updateMeters(t) { document.querySelectorAll(".section-title .meter-label").forEach(m => { const s = topicScore(t); m.textContent = `${s.done} of ${s.total} done`; }); }

function selfMark(t, n, box) {
  const s = keyState(t);
  const row = el("div", { class: "row selfmark" }, "Did you get it? ");
  const yes = el("button", { class: "btn", type: "button" }, "Yes, got it");
  const no = el("button", { class: "btn", type: "button" }, "Not yet");
  const paint = () => { yes.className = "btn" + (s.k[n] === true ? " on-good" : ""); no.className = "btn" + (s.k[n] === false ? " on-bad" : ""); };
  yes.onclick = () => { s.k[n] = true; save(); paint(); updateMeters(t); };
  no.onclick = () => { s.k[n] = false; save(); paint(); updateMeters(t); };
  paint(); row.append(yes, no); box.appendChild(row);
}

function reveal(q, label = "Answer") { return el("div", { class: "reveal" }, `<span class="lbl">${label}</span>${q.answer}`); }

function renderKey(t, q) {
  const s = keyState(t);
  const wrap = el("div", { class: "q", id: `t${t.num}q${q.n}` });
  wrap.innerHTML = `<div class="q-head"><span class="q-num">${q.n}.</span><div class="q-text">${q.q}</div></div>`;
  const body = el("div", { class: "q-body" });
  wrap.appendChild(body);
  if (q.type === "label" && q.img) body.appendChild(el("figure", { class: "figure" }, `<img src="${q.img}" alt="${q.fig}, a diagram with lettered parts" loading="lazy"><figcaption>${q.fig}</figcaption>`));

  if (q.type === "tf_fix") {
    const row = el("div", { class: "row" });
    const out = el("div");
    for (const val of [true, false]) {
      const b = el("button", { class: "btn", type: "button" }, val ? "True" : "False");
      b.onclick = () => {
        row.querySelectorAll("button").forEach(x => { x.disabled = true; x.className = "btn"; });
        const right = val === q.truth;
        b.className = "btn " + (right ? "on-good" : "on-bad");
        s.k[q.n] = right; save(); updateMeters(t);
        out.innerHTML = ""; out.appendChild(reveal(q, right ? "Correct" : "Not quite"));
        if (!q.truth) out.prepend(el("p", { class: "hint" }, "It's false, so how would you fix it? Say it in your head first, then read the answer."));
      };
      row.appendChild(b);
    }
    body.append(row, out);
    return wrap;
  }
  if (q.type === "match") {
    const box = el("div", { class: "match" });
    const rights = q.pairs.map(p => p[1]);
    const order = rights.map((_, i) => i).sort((a, b) => ((a * 7 + t.num) % 5) - ((b * 7 + t.num) % 5));
    const sels = q.pairs.map((p, i) => {
      const r = el("div", { class: "match-row" });
      const id = `m${t.num}-${q.n}-${i}`;
      r.innerHTML = `<label for="${id}">${p[0]}</label>`;
      const sel = el("select", { id });
      sel.innerHTML = `<option value="">Choose...</option>` + order.map(j => `<option value="${j}">${rights[j].replace(/<[^>]+>/g, "")}</option>`).join("");
      r.appendChild(sel); box.appendChild(r); return [r, sel, i];
    });
    const check = el("button", { class: "btn primary", type: "button" }, "Check");
    const msg = el("div");
    check.onclick = () => {
      let ok = 0;
      for (const [r, sel, i] of sels) { const good = sel.value === String(i); r.className = "match-row " + (good ? "good" : "bad"); ok += good; }
      s.k[q.n] = ok === sels.length; save(); updateMeters(t);
      msg.innerHTML = ""; msg.appendChild(el("div", { class: "feedback " + (ok === sels.length ? "good" : "bad") }, ok === sels.length ? "All matched correctly." : `${ok} of ${sels.length} right. Fix the red ones and check again.`));
    };
    body.append(box, el("div", { class: "row" }), msg); body.children[1].appendChild(check);
    return wrap;
  }
  // blank, choose, short, label: type, then reveal and self-mark
  const id = `a${t.num}-${q.n}`;
  const ta = el("textarea", { id, rows: q.type === "short" ? 3 : 2, "aria-label": `Your answer to question ${q.n}`, placeholder: "Type your answer" });
  ta.value = s.a[q.n] || "";
  ta.addEventListener("input", () => { s.a[q.n] = ta.value; save(); });
  const show = el("button", { class: "btn primary", type: "button" }, "Check answer");
  const out = el("div", { class: "q-body", style: "margin-left:0" });
  show.onclick = () => { out.innerHTML = ""; out.appendChild(reveal(q)); selfMark(t, q.n, out); show.hidden = true; };
  if (s.k[q.n] !== undefined) { out.appendChild(reveal(q)); selfMark(t, q.n, out); show.hidden = true; }
  const row = el("div", { class: "row" }); row.appendChild(show);
  body.append(ta, row, out);
  return wrap;
}

function renderMcq(t, m) {
  const s = keyState(t);
  const wrap = el("div", { class: "q", id: `t${t.num}q${m.n}` });
  wrap.innerHTML = `<div class="q-head"><span class="q-num">${m.n}.</span><div class="q-text">${m.q}</div></div>`;
  const body = el("div", { class: "q-body" });
  const opts = el("div", { class: "opts", role: "group", "aria-label": `Options for question ${m.n}` });
  const fb = el("div");
  const btns = m.options.map((o, i) => {
    const b = el("button", { class: "opt", type: "button" }, `<b>${"ABCD"[i]}</b><span>${o}</span>`);
    b.onclick = () => choose(i); opts.appendChild(b); return b;
  });
  function choose(i, quiet) {
    btns.forEach((b, j) => { b.disabled = true; if (j === m.answer) b.classList.add("good"); else if (j === i) b.classList.add("bad"); });
    const right = i === m.answer;
    if (!quiet) { s.m[m.n] = right; s.mc = s.mc || {}; s.mc[m.n] = i; save(); updateMeters(t); }
    fb.innerHTML = `<div class="feedback ${right ? "good" : "bad"}">${right ? "Correct." : `Not quite. The answer is ${"ABCD"[m.answer]}.`} <span>${m.why}</span></div>`;
  }
  if (s.mc && s.mc[m.n] !== undefined) choose(s.mc[m.n], true);
  body.append(opts, fb); wrap.appendChild(body);
  return wrap;
}

function renderTopic(t) {
  const i = DATA.topics.indexOf(t);
  const prev = DATA.topics[i - 1], next = DATA.topics[i + 1];
  app.innerHTML = `<div class="topic-hero">${t.hero ? `<img src="${t.hero}" alt="${t.heroAlt}">` : ""}<div><span class="yr">Topic ${t.num} · Year ${t.year} content</span><h1>${t.title}</h1></div><p class="lead" style="margin:0">${t.blurb}</p></div>
    <div class="section-title"><h2>Key ideas</h2><span class="meter-label"></span></div><p class="hint">Answer from memory first, then check.</p><div id="key"></div>
    <div class="section-title"><h2>VALID practice: ${t.valid.title}</h2></div><p class="hint">Read the information carefully. Most answers come from the table, graph or diagram.</p><div id="stim"></div><div id="mcq"></div>
    <nav class="pager">${prev ? `<a href="#topic${prev.num}">← Topic ${prev.num}: ${prev.title}</a>` : `<a href="#home">← All topics</a>`}${next ? `<a href="#topic${next.num}">Topic ${next.num}: ${next.title} →</a>` : `<a href="#long">Long answer practice →</a>`}</nav>`;
  const key = document.getElementById("key");
  t.key.forEach(q => key.appendChild(renderKey(t, q)));
  const v = t.valid, stim = document.getElementById("stim");
  const box = el("div", { class: "stim" });
  if (v.text) box.appendChild(el("p", {}, v.text));
  if (v.table) box.appendChild(el("div", { class: "tbl" }, `<table><caption>${v.table.caption}</caption><thead><tr>${v.table.headers.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${v.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`));
  if (v.graph) box.appendChild(el("figure", { class: "figure" }, `<img src="${v.graph}" alt="Graph of the data in the table" loading="lazy">`));
  if (v.diagram) box.appendChild(el("figure", { class: "figure" }, `<img src="${v.diagram}" alt="Diagram for the questions below" loading="lazy">`));
  stim.appendChild(box);
  const mcq = document.getElementById("mcq");
  v.mcq.forEach(m => mcq.appendChild(renderMcq(t, m)));
  updateMeters(t);
}

function renderLong() {
  app.innerHTML = `<div class="home-head"><h1>Long answer practice</h1><p class="lead">VALID has a few longer questions. Markers look for how well you link your ideas, not how much you write. Write your answer, then compare it with a strong sample.</p></div><div id="ext"></div>`;
  const box = document.getElementById("ext");
  const s = store.long = store.long || {};
  DATA.extended.forEach((e, i) => {
    const w = el("section", { class: "ext" });
    w.innerHTML = `<h2>Task ${i + 1}: Topic ${e.topic}, ${e.title}</h2><p class="ctx">${e.context}</p>`;
    e.parts.forEach((p, j) => {
      const id = `x${i}-${j}`;
      const lab = el("label", { for: id }, `${p.q} <span class="hint">(${p.marks} mark${p.marks > 1 ? "s" : ""})</span>`);
      const ta = el("textarea", { id, rows: 4 }); ta.value = s[id] || "";
      ta.addEventListener("input", () => { s[id] = ta.value; save(); });
      w.append(lab, ta);
    });
    if (e.starters.length) w.appendChild(el("p", { class: "starters" }, "<strong>Sentence starters:</strong> " + e.starters.join(" &nbsp;·&nbsp; ")));
    const b = el("button", { class: "btn primary", type: "button" }, "Show a strong answer");
    const out = el("div");
    b.onclick = () => { out.innerHTML = `<div class="reveal"><span class="lbl">A strong answer links ideas like this</span>${e.sample}</div>`; b.hidden = true; };
    const row = el("div", { class: "row" }); row.appendChild(b);
    w.append(row, out); box.appendChild(w);
  });
}

function route() {
  const h = (location.hash || "#home").slice(1);
  const m = /^topic(\d)$/.exec(h);
  const t = m && DATA.topics.find(x => x.num === Number(m[1]));
  if (t) { buildNav(h); renderTopic(t); }
  else if (h === "long") { buildNav(h); renderLong(); }
  else { buildNav("home"); renderHome(); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
